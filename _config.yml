author:
  # 英文姓名 / 中文姓名（侧栏、页脚）。
  name: Ye Cao
  name_zh: 曹烨
  # 原版无头像；需要时放进 images/，例如 /images/avatar.jpg。
  avatar: null
  # 英文研究方向、所在地、学校名称。中文对应字段在 author 下方。
  bio: 'Large Language Model · Recommender System · Generative AI'
  location: 'Chengdu, China'
  employer: 'UESTC'
  pubmed: null
  # Scholar 填完整 URL；email 填邮箱。不填写的项目保留 null。
  googlescholar: null
  email: caoye6233@gmail.com
  researchgate: null
  uri: null
  bitbucket: null
  codepen: null
  dribbble: null
  flickr: null
  facebook: null
  foursquare: null
  # 仅填个人 GitHub 用户名；留 null 时不生成个人账号链接。
  github: zzsky233
  google_plus: null
  keybase: null
  instagram: null
  impactstory: null
  lastfm: null
  linkedin: null
  dblp: null
  orcid: null
  pinterest: null
  soundcloud: null
  stackoverflow: null
  steam: null
  tumblr: null
  twitter: null
  vine: null
  weibo: null
  xing: null
  youtube: null
  wikipedia: null
  # 中文研究方向、所在地、学校名称；正文还需在两份 Markdown 中填写。
  bio_zh: '大语言模型 · 推荐系统 · 生成式AI'
  location_zh: '成都'
