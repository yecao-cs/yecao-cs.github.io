  wechat: null
include:
- .htaccess
- _pages
- files
exclude:
- README.md
- README.upstream.md
- UPSTREAM.md
- docs
- tools
- .preview
- package-lock.json
- google_scholar_crawler
- '*.sublime-project'
- '*.sublime-workspace'
- .asset-cache
- .bundle
- .jekyll-assets-cache
- .sass-cache
- .github
- CHANGELOG
- Capfile
- Gemfile
- Gruntfile.js
- LICENSE
- README
- Rakefile
- assets/js/_main.js
- assets/js/plugins
- assets/js/vendor
- config
- gulpfile.js
- log
- node_modules
- package.json
- tmp
- vendor
- design-qa.md
keep_files:
- .git
- .svn
encoding: utf-8
markdown_ext: markdown,mkdown,mkdn,mkd,md
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: '


  '
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
defaults:
- scope:
    path: ''
    type: pages
  values:
    layout: default
    author_profile: true
sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Asia/Shanghai
plugins:
- jekyll-paginate
- jekyll-sitemap
- jekyll-gist
- jekyll-feed
- jekyll-redirect-from
whitelist:
- jekyll-paginate
- jekyll-sitemap
- jekyll-gist
- jekyll-feed
- jemoji
compress_html:
  clippings: all
  ignore:
    envs: development
# 仅控制侧栏未填写联系方式的提示；正文不再重复联系方式。
show_placeholders: false
